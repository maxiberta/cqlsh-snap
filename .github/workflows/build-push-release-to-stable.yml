name: 5.X multi-arch builds (stable)
on:
  push:
    branches: [5.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-build
  cancel-in-progress: true

jobs:
  request-launchpad-build:
    uses: ./.github/workflows/request-launchpad-build.yml
    with:
      snap-name: cqlsh-5.x
    secrets:
      LP_CREDENTIALS_B64: ${{ secrets.LP_CREDENTIALS_B64 }}
